# Run in the foreground so Docker can track the process
background=NO

# Allow local system users to log in
local_enable=YES
write_enable=YES
local_umask=022

# Chroot local users to their home directory for security
chroot_local_user=YES
allow_writeable_chroot=YES

# Inform vsftpd where the secure empty directory is located
secure_chroot_dir=/var/run/vsftpd/empty

# Enable Passive Mode and define the port ranges for data transfer
anonymous_enable=NO
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40005