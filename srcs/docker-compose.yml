services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    networks: ['inception']
    restart: always
    env_file: .env
    volumes: ['mariadb_data:/var/lib/mysql']
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    networks: ['inception']
    restart: always
    env_file: .env
    depends_on: ['mariadb']
    volumes: ['wordpress_data:/var/www/wordpress']
  
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    networks: ['inception']
    restart: always
    ports: ["443:443"]
    depends_on: ['wordpress']
    volumes: ['wordpress_data:/var/www/wordpress']

networks:
  inception:
    driver: bridge

#volumes allow to store in a persistent disk the content in a local disk
#mariadb_data is a volume created by docker directly

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sayed/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sayed/data/wordpress